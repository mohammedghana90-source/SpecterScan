name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile everything (catches syntax errors across the board)
        run: |
          cd SpecterScan
          python -m py_compile core/*.py utils/*.py specterscan.py api.py tests/*.py

      - name: Run test suite
        run: |
          cd SpecterScan
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -v

      - name: CLI smoke test (no root needed — connect scan against localhost)
        run: |
          cd SpecterScan
          python specterscan.py scan 127.0.0.1 --ports 1 --scan-type connect --timeout 1 --retries 0
